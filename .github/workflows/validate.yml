name: Validate Kit v3

# Validation is intentionally main-only. Pull requests do not run Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install kit-tck
        run: go install github.com/docker/sandbox-kit-spec/v3/cmd/kit-tck@v3.0.0-m.6

      - name: Build v3 mixin OCI artifact
        run: |
          docker buildx build . -f yt-transcript.yaml \
            -t yt-transcript:1.0.0 \
            --output type=oci,dest=/tmp/yt-transcript-layout,tar=false

      - name: Validate v3 conformance
        run: kit-tck validate --layout /tmp/yt-transcript-layout 1.0.0

      - name: Check wrapper syntax
        run: bash -n run.sh
